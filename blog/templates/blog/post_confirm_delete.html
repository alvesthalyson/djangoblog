{% extends "blog/base.html" %}
{% load i18n %}

{% block title %}{% trans "Delete Post" %}{% endblock %}

{% block content %}
<h1>{% blocktrans with title=object.title %}Delete "{{ title }}"?{% endblocktrans %}</h1>
<p>{% trans "This cannot be undone." %}</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">{% trans "Yes, delete" %}</button>
    <a href="{% url 'post_detail' object.slug %}" class="btn btn-secondary">{% trans "Cancel" %}</a>
</form>
{% endblock %}
