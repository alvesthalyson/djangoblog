{% if page_obj.has_other_pages %}
<nav class="pager" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <a class="text-link text-link--quiet" href="?page={{ page_obj.previous_page_number }}{% if request.GET.category %}&category={{ request.GET.category }}{% endif %}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}">Previous</a>
  {% endif %}
  <span class="pager__status">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a class="text-link text-link--quiet" href="?page={{ page_obj.next_page_number }}{% if request.GET.category %}&category={{ request.GET.category }}{% endif %}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}">Next</a>
  {% endif %}
</nav>
{% endif %}
